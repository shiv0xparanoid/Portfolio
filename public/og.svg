<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Cream background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ee"/>
      <stop offset="1" stop-color="#ecebe5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2463"/>
      <stop offset="1" stop-color="#133388"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Name + tagline block left -->
  <g transform="translate(80, 100)">
    <text font-family="JetBrains Mono, monospace" font-size="18" fill="#6b7280" letter-spacing="4">PORTFOLIO · 2026</text>
    <text y="110" font-family="'Instrument Sans', sans-serif" font-size="140" font-weight="600" fill="#101218" letter-spacing="-4">
      Shivang
    </text>
    <text y="240" font-family="'Instrument Sans', sans-serif" font-size="140" font-weight="600" fill="#101218" letter-spacing="-4">
      Sagar
    </text>
    <text y="320" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="48" fill="#0a2463">
      “Technology, made tangible.”
    </text>
    <text y="390" font-family="'Instrument Sans', sans-serif" font-size="26" fill="#6b7280" width="900">
      AI/ML Engineer · Creative Technologist · Builder
    </text>
  </g>

  <!-- Telebot CRT icon right -->
  <g transform="translate(880, 160)">
    <rect width="240" height="180" rx="20" fill="#120f0a" stroke="url(#accent)" stroke-width="6"/>
    <rect x="20" y="20" width="200" height="120" rx="6" fill="#05060a"/>
    <rect x="80"  y="80" width="20" height="20" fill="#4cc9f0"/>
    <rect x="140" y="80" width="20" height="20" fill="#4cc9f0"/>
    <path d="M-20 -10 Q120 -70 260 -10" stroke="url(#accent)" stroke-width="8" fill="none"/>
    <circle cx="-10" cy="30" r="14" fill="#0a2463"/>
    <circle cx="250" cy="30" r="14" fill="#0a2463"/>
  </g>

  <!-- Bottom rule -->
  <rect x="80" y="560" width="1040" height="1" fill="#0a2463" opacity="0.18"/>
  <text x="80" y="600" font-family="JetBrains Mono, monospace" font-size="16" fill="#6b7280" letter-spacing="3">
    SHIVANGSAGAR.DEV · BUILT WITH NUXT · THREE.JS · GSAP
  </text>
</svg>
