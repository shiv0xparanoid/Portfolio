<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cream rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#f5f3ee"/>
  <!-- CRT head silhouette: rounded inner screen -->
  <rect x="14" y="18" width="36" height="28" rx="4" ry="4" fill="#120f0a" stroke="#0a2463" stroke-width="2"/>
  <!-- Pixel eyes (two squares) -->
  <rect x="24" y="28" width="4" height="4" fill="#4cc9f0"/>
  <rect x="36" y="28" width="4" height="4" fill="#4cc9f0"/>
  <!-- Headphone top band -->
  <path d="M10 20 Q32 4 54 20" stroke="#0a2463" stroke-width="3" fill="none"/>
  <circle cx="11" cy="26" r="3" fill="#0a2463"/>
  <circle cx="53" cy="26" r="3" fill="#0a2463"/>
  <!-- SS monogram bottom -->
  <text x="32" y="58" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0a2463" text-anchor="middle">SS</text>
</svg>
